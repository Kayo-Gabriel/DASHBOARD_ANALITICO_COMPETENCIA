name: aula-dashboard

services:
  dw_sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: db_dw_fluxo
    ports:
      - "1433:1433"
    env_file:
      - .env
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SQLSERVER_PASSWORD}
    volumes:
      - ./AdventureWorksDW2025.bak:/var/opt/mssql/backup/AdventureWorksDW2025.bak
    command: >
      bash -c "
      /opt/mssql/bin/sqlservr &
      sleep 25 &&
      /opt/mssql-tools18/bin/sqlcmd -S localhost -U ${SQLSERVER_USER} -P '${SQLSERVER_PASSWORD}' -C -Q \"RESTORE DATABASE AdventureWorksDW FROM DISK = '/var/opt/mssql/backup/AdventureWorksDW2025.bak' WITH REPLACE, MOVE 'AdventureWorksDW' TO '/var/opt/mssql/data/AdventureWorksDW.mdf', MOVE 'AdventureWorksDW_log' TO '/var/opt/mssql/data/AdventureWorksDW_log.ldf'\" &&
      wait
      "
    restart: unless-stopped
